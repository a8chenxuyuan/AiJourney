# frontend/nginx.conf
# 容器化部署的 Nginx 配置：
# - 托管 Vue 构建产物（History 路由回退到 index.html）
# - 将 /api 反向代理到后端容器，并对 SSE 流式接口关闭缓冲

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理：后端路由统一以 /api 为前缀，原样透传
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 必需：关闭缓冲，避免流式日志被 Nginx 攒包导致前端看不到实时进度
        proxy_buffering off;
        proxy_cache off;
        # 规划链路含多次 LLM 调用，长超时避免 SSE 中途被掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vue Router History 模式：所有前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
