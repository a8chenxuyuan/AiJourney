[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    # 中文注释/字符串中的全角标点会被误报为歧义 Unicode 字符
    "RUF001", "RUF002", "RUF003",
    # FastAPI 依赖注入的惯用写法（Depends/Query/Path 等在参数默认值中调用）
    "B008",
]
