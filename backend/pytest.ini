[pytest]
# pytest 配置：测试目录与运行参数
# 运行方式（backend 目录下）：venv\Scripts\python.exe -m pytest tests/ -v
testpaths = tests
addopts = -q --tb=short
# pytest-asyncio 自动模式：async 测试函数/夹具自动在独立事件循环中执行
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: 端到端测试，需要后端服务(run.py)与 Worker(worker.py) 同时运行
