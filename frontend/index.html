<!DOCTYPE html>
<!-- index.html：前端应用入口 HTML 文件 -->
<!-- 作用：提供单页应用的挂载容器（#app），并引入 Vite 编译后的主入口脚本 -->
<html lang="zh-CN">
  <head>
    <!-- 字符编码声明 -->
    <meta charset="UTF-8" />
    <!-- 视口配置，适配移动端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 页面标题 -->
    <title>agent1旅行 - 智能旅行助手</title>
  </head>
  <body>
    <!-- #app：Vue 应用挂载的根 DOM 节点 -->
    <div id="app"></div>
    <!-- 引入 Vite 主入口模块 src/main.ts -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
